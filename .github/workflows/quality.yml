name: Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: gitleaks sobre el repo y su historia
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_8.30.1_checksums.txt"
          grep linux_x64.tar.gz gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xz gitleaks -f gitleaks_8.30.1_linux_x64.tar.gz
          ./gitleaks git --redact --no-banner -v .
      - name: El código carga
        if: always()
        run: git ls-files -z '*.py' | xargs -0 python -m compileall -q
