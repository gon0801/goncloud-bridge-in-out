name: Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: gitleaks sobre el repo y su historia
        run: |
          v=8.30.1
          f=gitleaks_${v}_linux_x64.tar.gz
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${v}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks git --redact --no-banner -v .
      - name: El código carga
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.py' | xargs -0r python -m compileall -q
