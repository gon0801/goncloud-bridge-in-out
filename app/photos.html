<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotos de Productos — GONCLOUD</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #16244a;
      --border: #2a3a6a;
      --text: #e0eaff;
      --muted: #7a8fbb;
      --accent: #3b82f6;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; }

    #loading-bar {
      height: 3px;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
      position: fixed;
      top: 0; left: 0;
      z-index: 300;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 1rem; font-weight: 700; white-space: nowrap; }

    .toolbar { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; flex: 1; }

    input[type=search] {
      background: #0d1829;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 240px;
    }
    input[type=search]:focus { outline: none; border-color: var(--accent); }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.2); }
    .btn.sec {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn.sec:hover { border-color: var(--accent); color: var(--text); }

    #status { color: var(--muted); font-size: 0.82rem; margin-left: auto; white-space: nowrap; }

    main { padding: 1.25rem 1.5rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.9rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 1;
      background: #0d1829;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
      overflow: hidden;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .card-img-wrap .placeholder {
      font-size: 2.5rem;
      color: var(--border);
      user-select: none;
    }

    .card-body {
      padding: 0.55rem 0.7rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .card-sku {
      font-family: monospace;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
    }
    .card-name {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0.7rem;
      border-top: 1px solid var(--border);
    }
    .badge {
      background: #1e2f50;
      color: var(--muted);
      font-size: 0.68rem;
      padding: 0.12rem 0.45rem;
      border-radius: 20px;
    }
    .badge.ok { background: #14532d44; color: var(--ok); }
    .dl-link {
      font-size: 0.7rem;
      color: var(--muted);
      text-decoration: none;
      padding: 0.15rem 0.4rem;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .dl-link:hover { color: var(--text); border-color: var(--accent); }

    .empty { text-align: center; color: var(--muted); padding: 5rem 1rem; font-size: 1rem; }

    /* Modal */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 200;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #modal.open { display: flex; }
    #modal-content { position: relative; max-width: 92vw; max-height: 92vh; }
    #modal-img {
      max-width: 100%;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }
    #modal-sku {
      position: absolute;
      bottom: -1.8rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: monospace;
      font-size: 0.82rem;
      color: var(--muted);
    }
    #modal-dl {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: rgba(0,0,0,0.6);
      color: var(--text);
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      font-size: 0.78rem;
      text-decoration: none;
      border: 1px solid var(--border);
    }
    #modal-dl:hover { background: var(--accent); border-color: var(--accent); }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      input[type=search] { width: 180px; }
    }
  </style>
</head>
<body>

<div id="loading-bar"></div>

<header>
  <h1>📷 Fotos de Productos</h1>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Buscar SKU o nombre…">
    <button class="btn sec" id="reload-btn" onclick="load()">↺ Recargar</button>
    <a class="btn sec" id="zip-btn" href="/api/photos/export.zip">⬇ Exportar ZIP</a>
  </div>
  <span id="status">Cargando…</span>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No se encontraron productos.</div>
</main>

<!-- Modal imagen completa -->
<div id="modal">
  <div id="modal-content">
    <img id="modal-img" src="" alt="">
    <span id="modal-sku"></span>
    <a id="modal-dl" href="#" download="">⬇ Descargar</a>
  </div>
</div>

<script>
let allProducts = [];

async function load() {
  const bar = document.getElementById('loading-bar');
  const status = document.getElementById('status');

  bar.style.width = '20%';
  status.textContent = 'Cargando productos…';

  try {
    const res = await fetch('/api/photos/products');
    bar.style.width = '60%';
    const data = await res.json();

    if (!data.ok) {
      status.textContent = 'Error: ' + data.error;
      bar.style.width = '0%';
      return;
    }

    allProducts = data.products;
    render(allProducts);
  } catch (e) {
    status.textContent = 'Error de red: ' + e.message;
  }

  bar.style.width = '100%';
  setTimeout(() => { bar.style.width = '0%'; }, 400);
}

function render(products) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const status = document.getElementById('status');

  status.textContent = products.length + ' producto' + (products.length !== 1 ? 's' : '');

  if (!products.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = products.map(p => {
    const sku = esc(p.sku);
    const name = esc(p.name);
    const qty = p.qty || 0;
    return `
      <div class="card">
        <div class="card-img-wrap" onclick="openModal('${sku}')">
          <img
            data-src="/api/product-image/${sku}"
            src=""
            alt="${sku}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block'"
          >
          <span class="placeholder" style="display:none">📦</span>
        </div>
        <div class="card-body">
          <div class="card-sku">${sku}</div>
          <div class="card-name">${name}</div>
        </div>
        <div class="card-footer">
          <span class="badge ${qty > 0 ? 'ok' : ''}">${qty} uds</span>
          <a class="dl-link" href="/api/product-image/${sku}" download="${sku}.jpg">↓ DL</a>
        </div>
      </div>
    `;
  }).join('');

  lazyLoad();
}

function lazyLoad() {
  const imgs = document.querySelectorAll('img[data-src]');
  if (!imgs.length) return;
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const img = e.target;
        img.src = img.dataset.src;
        delete img.dataset.src;
        obs.unobserve(img);
      }
    });
  }, { rootMargin: '300px' });
  imgs.forEach(img => io.observe(img));
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Búsqueda
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  const filtered = q
    ? allProducts.filter(p =>
        p.sku.toLowerCase().includes(q) || p.name.toLowerCase().includes(q))
    : allProducts;
  render(filtered);
});

// Modal
function openModal(sku) {
  const modal = document.getElementById('modal');
  const img = document.getElementById('modal-img');
  const label = document.getElementById('modal-sku');
  const dl = document.getElementById('modal-dl');

  img.src = '/api/product-image/' + sku + '?full=1';
  label.textContent = sku;
  dl.href = '/api/product-image/' + sku + '?full=1';
  dl.download = sku + '.jpg';
  modal.classList.add('open');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this || e.target.id === 'modal-content' || e.target.id === 'modal-img') {
    this.classList.remove('open');
    document.getElementById('modal-img').src = '';
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('modal').classList.remove('open');
    document.getElementById('modal-img').src = '';
  }
});

load();
</script>
</body>
</html>
