services:
  redis:
    image: redis:7-alpine
    container_name: bridge-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--slowlog-log-slower-than", "10000", "--slowlog-max-len", "128"]
    volumes:
      - /mnt/data/appdata/bridge/redis:/data
    restart: unless-stopped
    networks:
      - goncloud-net

  bridge-api:
    env_file:
      - .env
    build: ./app
    container_name: bridge-api
    working_dir: /app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - /mnt/data/appdata/bridge/data:/data
      - /mnt/data/appdata/bridge/app:/app
    environment:
      - ENABLE_MISSING_ZERO_CHANNELS=amazon_fbm,meli
      - BRIDGE_DB=/data/bridge.db
      - REDIS_URL=redis://bridge-redis:6379/0
    ports:
      # El ingress real de los webhooks es un Cloudflare Tunnel (servicio del
      # host, config remota en el dashboard): enruta
      # meli-webhooks.goncloud.cc -> http://localhost:8099. Si este puerto no
      # esta publicado en loopback, cloudflared resuelve localhost a [::1], se
      # come un "connection refused" y MeLi se queda sin entregar — 19 dias
      # asi desde 2026-08-24, 138 intentos rechazados por dia. Los otros tres
      # servicios del tunnel (8080/8081/8082) publican en 127.0.0.1 igual.
      - "127.0.0.1:8099:8099"
      # Acceso por WireGuard (UI de /mapper, diagnostico desde la LAN).
      - "10.13.13.1:8099:8099"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - goncloud-net
      - odoo_odoo_net
      # `proxy` es la red de nginx-proxy-manager, que sirve mapper.goncloud.cc
      # (UI del SKU mapper) hacia este servicio. Sin ella nginx no resuelve el
      # upstream "bridge-api" y esa ruta devuelve 502. NO es por donde entran
      # los webhooks — eso es el Cloudflare Tunnel, ver el bloque `ports`.
      # Va aca y no con `docker network connect` porque la union manual se
      # pierde en cada recreate del contenedor.
      - proxy

  bridge-worker:
    build: ./app
    container_name: bridge-worker
    working_dir: /app
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - /mnt/data/appdata/bridge/data:/data
      - /mnt/data/appdata/bridge/app:/app
    environment:
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}

      - BRIDGE_DB=/data/bridge.db
      - REDIS_URL=redis://bridge-redis:6379/0
      - QUEUE_NAME=stock_jobs
    command: ["python", "/app/worker.py"]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - goncloud-net
      - odoo_odoo_net

  bridge-inbound-worker:
    build: ./app
    container_name: bridge-inbound-worker
    working_dir: /app
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - /mnt/data/appdata/bridge/data:/data
      - /mnt/data/appdata/bridge/app:/app
    environment:
      - BRIDGE_DB=/data/bridge.db
      - REDIS_URL=redis://bridge-redis:6379/0
      - MELI_TOKEN_FILE=/data/.meli_tokens.json
    command: ["python", "/app/inbound_worker.py"]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - goncloud-net
      - odoo_odoo_net

  bridge-amazon-inbound-worker:
    build: ./app
    container_name: bridge-amazon-inbound-worker
    working_dir: /app
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - /mnt/data/appdata/bridge/data:/data
      - /mnt/data/appdata/bridge/app:/app
    environment:
      - BRIDGE_DB=/data/bridge.db
      - REDIS_URL=redis://bridge-redis:6379/0
    command: ["python", "/app/amazon_inbound_worker.py"]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - goncloud-net
      - odoo_odoo_net

networks:
  goncloud-net:
    external: true
  odoo_odoo_net:
    external: true
  # La crea el compose de nginx-proxy-manager; aca solo se referencia.
  proxy:
    external: true
